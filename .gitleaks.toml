title = "EMS repository Gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Known Homey Logic variable ID that stores the runtime GitHub token; this UUID is an identifier, not a credential"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''(?i)token[^\n]{0,40}235cfe0f-5760-48b9-9349-a33be47d04d1''']
