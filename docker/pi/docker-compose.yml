services:
  ems-core:
    build:
      context: ../..
      dockerfile: docker/pi/Dockerfile
    restart: unless-stopped
    environment:
      EMS_MODE: ${EMS_MODE:-SHADOW}
      TZ: ${TZ:-Europe/Amsterdam}
      DATABASE_URL: postgresql://ems:${POSTGRES_PASSWORD:-change-me}@postgres:5432/ems
      MQTT_HOST: mosquitto
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

  management-api:
    build:
      context: ../..
      dockerfile: docker/pi/Dockerfile
    command: ["uvicorn", "management_api:app", "--host", "0.0.0.0", "--port", "8080", "--no-server-header"]
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment:
      EMS_MODE: ${EMS_MODE:-SHADOW}
      EMS_RELEASE: pi-ems-bootstrap-v0.1
      DATABASE_URL: postgresql://ems:${POSTGRES_PASSWORD:-change-me}@postgres:5432/ems
      MANAGEMENT_API_TOKEN: ${MANAGEMENT_API_TOKEN:?MANAGEMENT_API_TOKEN is required}
      HOMEY_BASE_URL: ${HOMEY_BASE_URL:-}
      HOMEY_TOKEN: ${HOMEY_TOKEN:-}
      VICTRON_HOST: ${VICTRON_HOST:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:8080"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ems
      POSTGRES_USER: ems
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ems -d ems"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data

volumes:
  postgres_data:
  mosquitto_data:
