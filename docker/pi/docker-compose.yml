services:
  ems-core:
    build:
      context: ../..
      dockerfile: docker/pi/Dockerfile
    restart: unless-stopped
    environment:
      EMS_MODE: ${EMS_MODE:-SHADOW}
      TZ: ${TZ:-Europe/Amsterdam}
      DATABASE_URL: postgresql://ems:${POSTGRES_PASSWORD:-change-me}@postgres:5432/ems
      MQTT_HOST: mosquitto
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ems
      POSTGRES_USER: ems
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ems -d ems"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
    volumes:
      - mosquitto_data:/mosquitto/data

volumes:
  postgres_data:
  mosquitto_data:
