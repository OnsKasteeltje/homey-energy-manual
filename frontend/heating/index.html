<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>EMS · Verwarming</title>
  <link rel="stylesheet" href="../shared/styles/v2-shell.css">
  <link rel="stylesheet" href="./styles/heating.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="../live/">EMS <span>Productie</span></a>
  <nav data-ems-main-nav aria-label="Hoofdnavigatie"></nav>
  <div id="freshness" class="freshness">Laden…</div>
</header>

<main>
  <section class="intro">
    <div>
      <small>HEATING FLEX V2 · SHADOW</small>
      <h1>Verwarming</h1>
      <p>Honeywell baseline · werkelijke kamertemperatuur · EMS preheat shadow · 6 uur terug · 18 uur vooruit</p>
    </div>
  </section>

  <section class="panel">
    <header>
      <div>
        <small>ROLLING 24 UUR</small>
        <h2>Temperatuur &amp; voorverwarming</h2>
      </div>
      <span class="badge">SHADOW</span>
    </header>

    <div id="cluster-summary" class="clusters"></div>
    <div id="heating-status" class="status-strip"></div>
    <div id="signal-legend" class="signal-legend"></div>
    <div id="legend" class="legend"></div>

    <div class="chart-wrap">
      <svg id="heating-chart" role="img" aria-label="Honeywell baseline, gemeten kamertemperatuur en EMS preheat shadow"></svg>
      <div id="tooltip" class="tooltip" hidden></div>
    </div>

    <div id="room-status" class="room-status-grid"></div>
    <p id="empty" hidden>Verwarmingsanalyse niet beschikbaar.</p>
  </section>

  <p class="preview-note">EMS productie · Heating Flex V2 shadow</p>
</main>

<script type="module" src="./render/heating.js"></script>
<script type="module" src="../shared/navigation.js"></script>
</body>
</html>
