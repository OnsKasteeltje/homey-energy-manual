name: Planner v0.4.8 fixed-contract validation

on:
  push:
    branches:
      - fix/fixed-contract-planner-ui-order
    paths:
      - src/homey/planner/energy-plan-24h-v0.4.7.js
      - src/homey/planner/tools/materialize-energy-plan-v0.4.8.sh
      - .github/workflows/planner-v0.4.8-fixed-contract-validation.yml
      - docs/javascripts/planner-forecast-timeline-order-v1.0.0.js
      - mkdocs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fixed-contract-planner-ui-order
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Materialize Planner v0.4.8
        run: bash src/homey/planner/tools/materialize-energy-plan-v0.4.8.sh

      - name: Validate fixed-contract semantics
        run: |
          node <<'NODE'
          const normalize = raw => {
            const contractRaw = String(raw || 'UNKNOWN').toUpperCase();
            return contractRaw === 'VAST' ? 'FIXED' : contractRaw;
          };
          const cases = [
            ['VAST','FIXED'],
            ['vast','FIXED'],
            ['FIXED','FIXED'],
            ['DYNAMIC','DYNAMIC'],
            ['UNKNOWN','UNKNOWN']
          ];
          for (const [input, expected] of cases) {
            const actual = normalize(input);
            if (actual !== expected) throw new Error(`${input}: expected ${expected}, got ${actual}`);
          }
          console.log('Contract normalization: PASS');
          NODE
          grep -Fq "const dynamicPrices=contract==='DYNAMIC'?" src/homey/planner/energy-plan-24h-v0.4.8.js
          grep -Fq "if(contract==='DYNAMIC')" src/homey/planner/energy-plan-24h-v0.4.8.js
          grep -Fq "priceClass:contract==='FIXED'?'FIXED'" src/homey/planner/energy-plan-24h-v0.4.8.js
          grep -Fq "priceUsable=contract==='FIXED'||" src/homey/planner/energy-plan-24h-v0.4.8.js
          echo 'Fixed contract excludes spot-price ranking and resolves FIXED metadata: PASS'

      - name: Validate Planner UI order hook
        run: |
          grep -Fq "planner-forecast-timeline-order-v1.0.0.js" mkdocs.yml
          grep -Fq "balanceSection.before(forecastSection)" docs/javascripts/planner-forecast-timeline-order-v1.0.0.js
          grep -Fq "querySelectorAll(':scope > .ps-action-row')" docs/javascripts/planner-forecast-timeline-order-v1.0.0.js
          node --check docs/javascripts/planner-forecast-timeline-order-v1.0.0.js
          echo 'Planner timeline reorder hook: PASS'

      - name: Pin exact validated candidate
        run: |
          if git diff --quiet -- src/homey/planner/energy-plan-24h-v0.4.8.js && git ls-files --error-unmatch src/homey/planner/energy-plan-24h-v0.4.8.js >/dev/null 2>&1; then
            echo 'Validated candidate already pinned.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/homey/planner/energy-plan-24h-v0.4.8.js
          git commit -m 'build: pin validated Planner v0.4.8 candidate'
          git push origin HEAD:fix/fixed-contract-planner-ui-order
