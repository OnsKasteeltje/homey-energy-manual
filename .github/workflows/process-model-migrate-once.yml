name: Process Model Migrate Once

on:
  push:
    branches:
      - docs/process-model-generator

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/process-model-generator
      - name: Migrate legacy Mermaid
        run: python3 scripts/migrate_legacy_mermaid.py
      - name: Verify generated diagrams
        run: python3 scripts/generate_process_diagrams.py --check
      - name: Commit migrated flows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/software-architecture/flows
          if git diff --cached --quiet; then
            echo "No migration changes"
          else
            git commit -m "docs: migrate all flow diagrams to process-model source"
            git push origin HEAD:docs/process-model-generator
          fi
