name: EMS Architecture Gate

on:
  pull_request:
    paths:
      - 'src/pi/**'
      - 'services/pi/**'
      - 'tests/**'
      - 'deploy/**'
      - 'config/**'
      - 'tools/**'
      - 'scripts/deploy_ems_pi.sh'
      - 'scripts/ems_architecture_gate.sh'
      - 'scripts/ems_pi_drift_check.sh'
      - 'docs/architecture/CURRENT-EMS-STATE.md'
      - 'docs/architecture/repository-structure.md'
      - '.github/workflows/ems-architecture-gate.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/pi/**'
      - 'services/pi/**'
      - 'tests/**'
      - 'deploy/**'
      - 'config/**'
      - 'tools/**'
      - 'scripts/deploy_ems_pi.sh'
      - 'scripts/ems_architecture_gate.sh'
      - 'scripts/ems_pi_drift_check.sh'
      - 'docs/architecture/CURRENT-EMS-STATE.md'
      - 'docs/architecture/repository-structure.md'
      - '.github/workflows/ems-architecture-gate.yml'

jobs:
  architecture-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine comparison base
        id: base
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            BEFORE="${{ github.event.before }}"
            if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
              BEFORE="$(git rev-parse HEAD^)"
            fi
            echo "ref=$BEFORE" >> "$GITHUB_OUTPUT"
          fi

      - name: Run repository structure gate
        run: bash tools/validation/repository_structure_gate.sh "${{ steps.base.outputs.ref }}"

      - name: Run EMS architecture gate
        run: bash scripts/ems_architecture_gate.sh "${{ steps.base.outputs.ref }}"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run canonical Pi tests
        run: python -m pytest -q tests/state tests/planner tests/control/heating

      - name: Run Quooker detector regression tests
        run: node --test tests/quooker-detector-v0.4.test.mjs

      - name: Run Quooker AI evidence regression tests
        run: |
          python tests/integrations/test_quooker_evidence_contract.py
          python tests/integrations/test_ai_v0_4_flex_context_contract.py

      - name: Run history integration regression tests
        run: |
          python -m pytest -q \
            tests/integrations/test_build_15m_history.py \
            tests/integrations/test_history_archive_counters.py \
            tests/integrations/test_house_energy_history.py \
            tests/integrations/test_web_data_api.py

      - name: Run PV surplus replay validation tests
        run: python tests/replay/test_pv_surplus_absorption_backtest.py

      - name: Run EV phase-current controller tests
        run: |
          node --test \
            tests/ev-phase-current-controller-v0.1.test.mjs \
            tests/ev-phase-current-controller-v0.2.test.mjs \
            tests/ev-phase-current-bridge-v1.5.7.test.mjs

      - name: Run EV phase writer contract tests
        run: |
          node --test \
            tests/ev-phase-transition-state-machine.test.mjs \
            tests/ev-phase-writer-v0.4.3-live.test.mjs \
            tests/ev-phase-writer-v0.4.4-bounded.test.mjs \
            tests/ev-phase-v044-upgrade-guard.test.mjs
