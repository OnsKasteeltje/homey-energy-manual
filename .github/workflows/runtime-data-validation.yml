name: Validate runtime energy data

on:
  push:
    branches:
      - main
    paths:
      - "docs/data/homey-status.json"
      - "docs/data/shadow-status.json"
      - "docs/data/energy-state-v2.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-data-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.15"
      - name: Validate repository and Energy State contract
        run: python scripts/validate_repository.py
