name: Software Architecture Build

on:
  pull_request:
    paths:
      - 'docs/software-architecture/**'
      - 'scripts/build_software_architecture.py'
      - 'scripts/qa_software_architecture.py'
      - 'scripts/generate_process_diagrams.py'
      - 'scripts/migrate_legacy_mermaid.py'
      - 'scripts/build_architecture_publication.py'
      - 'scripts/mermaid-puppeteer-config.json'
      - '.github/workflows/software-architecture-build.yml'
  push:
    branches: [main]
    paths:
      - 'docs/software-architecture/**'
      - 'scripts/build_software_architecture.py'
      - 'scripts/qa_software_architecture.py'
      - 'scripts/generate_process_diagrams.py'
      - 'scripts/migrate_legacy_mermaid.py'
      - 'scripts/build_architecture_publication.py'
      - 'scripts/mermaid-puppeteer-config.json'
      - '.github/workflows/software-architecture-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install document toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer poppler-utils
          npm install --global @mermaid-js/mermaid-cli

      - name: Reject legacy hand-maintained Mermaid
        run: python3 scripts/migrate_legacy_mermaid.py --check

      - name: Verify process diagrams are generated from process-model
        run: python3 scripts/generate_process_diagrams.py --check

      - name: Build master Markdown
        run: python3 scripts/build_software_architecture.py

      - name: QA master Markdown
        run: python3 scripts/qa_software_architecture.py

      - name: Verify generated Markdown
        run: |
          test -s docs/software-architecture/generated/software-architecture.md
          grep -q '^# Softwarearchitectuur Home Energy Management System$' docs/software-architecture/generated/software-architecture.md

      - name: Build publication Markdown and render diagrams
        run: python3 scripts/build_architecture_publication.py

      - name: Verify named process diagrams and hard flow pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build/software-architecture-publication.md')
          text = p.read_text(encoding='utf-8')
          assert 'Softwarearchitectuur Overzicht' in text
          assert 'Systeemcontext' in text
          assert '24h Energy Planner and Power Intent' in text
          assert 'w:type="page"' in text
          count = text.count('![Procesdiagram — ')
          assert count == 44, f'expected 44 named process diagrams, got {count}'
          assert '![Procesdiagram](' not in text, 'generic process caption remains'
          print('PASS: 44 named, hard page-bounded process diagrams')
          PY

      - name: Build publication DOCX with real TOC
        run: |
          pandoc \
            build/software-architecture-publication.md \
            --from=markdown+raw_attribute \
            --to=docx \
            --resource-path=build \
            --number-sections \
            --toc \
            --toc-depth=3 \
            --metadata toc-title='Inhoudsopgave' \
            --metadata title='Softwarearchitectuur Home Energy Management System' \
            --output=build/Softwarearchitectuur_Home_Energy_Management_System.docx
          test -s build/Softwarearchitectuur_Home_Energy_Management_System.docx

          # LibreOffice lays out the document and updates fields, including TOC page numbers.
          mkdir -p /tmp/lo-update /tmp/updated-docx
          libreoffice \
            -env:UserInstallation=file:///tmp/lo-update \
            --headless \
            --convert-to docx \
            --outdir /tmp/updated-docx \
            build/Softwarearchitectuur_Home_Energy_Management_System.docx
          if test -s /tmp/updated-docx/Softwarearchitectuur_Home_Energy_Management_System.docx; then
            cp /tmp/updated-docx/Softwarearchitectuur_Home_Energy_Management_System.docx build/Softwarearchitectuur_Home_Energy_Management_System.docx
          fi

      - name: Verify publication source, TOC and captions
        run: |
          pandoc build/Softwarearchitectuur_Home_Energy_Management_System.docx -t plain > /tmp/publication.txt
          if grep -q '\"kind\": \"mermaid-source\"' /tmp/publication.txt; then
            echo 'FAIL: process-model source leaked into publication DOCX'
            exit 1
          fi
          if grep -q 'GENERATED_MERMAID:' /tmp/publication.txt; then
            echo 'FAIL: generated marker leaked into publication DOCX'
            exit 1
          fi
          if grep -q '^flowchart ' /tmp/publication.txt; then
            echo 'FAIL: Mermaid source leaked into publication DOCX'
            exit 1
          fi
          grep -q 'Inhoudsopgave' /tmp/publication.txt
          grep -q 'Softwarearchitectuur Overzicht' /tmp/publication.txt
          grep -q 'Systeemcontext' /tmp/publication.txt
          grep -q '24h Energy Planner and Power Intent' /tmp/publication.txt
          grep -q 'Procesdiagram — ' /tmp/publication.txt
          echo 'PASS: TOC, expected headings and named process captions present in DOCX'

      - name: Build PDF from DOCX
        run: |
          mkdir -p /tmp/lo-profile
          libreoffice \
            -env:UserInstallation=file:///tmp/lo-profile \
            --headless \
            --convert-to pdf \
            --outdir build \
            build/Softwarearchitectuur_Home_Energy_Management_System.docx
          test -s build/Softwarearchitectuur_Home_Energy_Management_System.pdf
          pdfinfo build/Softwarearchitectuur_Home_Energy_Management_System.pdf | grep -q '^Pages:'

      - name: Verify PDF contains TOC page numbers
        run: |
          pdftotext -layout build/Softwarearchitectuur_Home_Energy_Management_System.pdf /tmp/publication-pdf.txt
          grep -q 'Inhoudsopgave' /tmp/publication-pdf.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('/tmp/publication-pdf.txt').read_text(encoding='utf-8', errors='ignore')
          toc_pos = text.find('Inhoudsopgave')
          assert toc_pos >= 0
          sample = text[toc_pos:toc_pos + 12000]
          page_refs = re.findall(r'\.{2,}\s*\d+\s*$', sample, re.M)
          assert len(page_refs) >= 5, f'TOC page numbers not detected; found {len(page_refs)}'
          print(f'PASS: TOC contains page-number references ({len(page_refs)} detected)')
          PY

      - name: Upload architecture artifacts
        uses: actions/upload-artifact@v4
        with:
          name: software-architecture
          path: |
            docs/software-architecture/generated/software-architecture.md
            build/software-architecture-publication.md
            build/Softwarearchitectuur_Home_Energy_Management_System.docx
            build/Softwarearchitectuur_Home_Energy_Management_System.pdf
          if-no-files-found: error
