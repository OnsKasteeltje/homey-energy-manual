name: Test Core v0.11f Planner Tesla headroom

on:
  push:
    branches: [core-v0.11e-planner-tesla-intent]
    paths:
      - src/homey/core/core-v0.11e-planner-tesla-intent.js
      - src/homey/core/core-v0.11e-planner-tesla-decision.js
      - src/homey/core/test-core-v0.11e-planner-tesla-decision.js
      - src/homey/core/generate-core-v0.11f-from-v0.11e.py
      - .github/workflows/test-core-v0.11e-planner-tesla.yml
  pull_request:
    paths:
      - src/homey/core/core-v0.11e-planner-tesla-intent.js
      - src/homey/core/core-v0.11e-planner-tesla-decision.js
      - src/homey/core/test-core-v0.11e-planner-tesla-decision.js
      - src/homey/core/generate-core-v0.11f-from-v0.11e.py
      - .github/workflows/test-core-v0.11e-planner-tesla.yml

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate v0.11f from deployed v0.11e candidate
        run: python3 src/homey/core/generate-core-v0.11f-from-v0.11e.py
      - name: Verify narrow headroom diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --no-index -- src/homey/core/core-v0.11e-planner-tesla-intent.js src/homey/core/core-v0.11f-planner-tesla-headroom.js > /tmp/v011f.diff || true
          cat /tmp/v011f.diff
          test "$(grep -c '^@@' /tmp/v011f.diff)" -le 6
          grep -q "EM2_CORE_STATE_V0.11f" /tmp/v011f.diff
          grep -q "plannerTeslaProjectedGridW=gridW+PLANNER_TESLA_MIN_POWER_W" /tmp/v011f.diff
          grep -q "PLANNER_TESLA_BLOCKED_PROJECTED_IMPORT" /tmp/v011f.diff
          ! grep -q '^+.*setCapabilityValue' /tmp/v011f.diff
          ! grep -q '^+.*Homey.devices.getDevice' /tmp/v011f.diff
          ! grep -q '^+.*Homey.logic.getVariables' /tmp/v011f.diff
      - name: Run runtime-fixture regression
        run: node src/homey/core/test-core-v0.11e-planner-tesla-decision.js
      - name: Preserve architecture boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -q "EM2_CONTROL_WW_V0.11" src/homey/core/core-v0.11f-planner-tesla-headroom.js
          grep -q "const evMode=intent==='TESLA_CHARGE_DEADLINE'?'DEADLINE'" src/homey/core/core-v0.11f-planner-tesla-headroom.js
          test "$(grep -o 'Homey.logic.getVariables()' src/homey/core/core-v0.11f-planner-tesla-headroom.js | wc -l)" -eq 1
          ! grep -q 'setCapabilityValue' src/homey/core/core-v0.11f-planner-tesla-headroom.js
      - name: Commit generated candidate on branch push
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/homey/core/core-v0.11f-planner-tesla-headroom.js
          if git diff --cached --quiet; then echo "Candidate current"; else git commit -m "build(core): generate v0.11f Planner Tesla headroom candidate"; git push origin HEAD:${{ github.ref_name }}; fi
