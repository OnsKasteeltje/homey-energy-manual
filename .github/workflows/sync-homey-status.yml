name: Sync Homey status

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install official Homey CLI
        run: npm install --global homey

      - name: Read standard flows
        env:
          HOMEY_ID: ${{ secrets.HOMEY_ID }}
          HOMEY_TOKEN: ${{ secrets.HOMEY_TOKEN }}
        run: |
          mkdir -p tmp
          homey api raw --homey-id "$HOMEY_ID" --token "$HOMEY_TOKEN" --path /api/manager/flow/flow > tmp/standard-flows.json

      - name: Read advanced flows
        env:
          HOMEY_ID: ${{ secrets.HOMEY_ID }}
          HOMEY_TOKEN: ${{ secrets.HOMEY_TOKEN }}
        run: |
          homey api raw --homey-id "$HOMEY_ID" --token "$HOMEY_TOKEN" --path /api/manager/flow/advancedflow > tmp/advanced-flows.json

      - name: Build website status JSON
        run: python scripts/build_status.py

      - name: Commit status when changed
        run: |
          if git diff --quiet -- docs/data/homey-status.json; then
            echo "No status change"
            exit 0
          fi
          git config user.name "homey-status-bot"
          git config user.email "homey-status-bot@users.noreply.github.com"
          git add docs/data/homey-status.json
          git commit -m "chore: update Homey status"
          git push
