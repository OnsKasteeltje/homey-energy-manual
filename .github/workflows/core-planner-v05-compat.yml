name: Core Planner v0.5 compatibility

on:
  push:
    branches:
      - prep/planner-v0.5-power-intent-efficiency
    paths:
      - 'src/homey/core/core-v0.11f.live-homey.js'
      - 'src/homey/core/core-planner-v05-compat.js'
      - 'scripts/build-core-v0.11g-planner-v05-candidate.js'
      - 'tests/core-planner-v05-compat.test.js'
      - 'tests/core-v0.11g-integration.test.js'
      - '.github/workflows/core-planner-v05-compat.yml'
  pull_request:
    paths:
      - 'src/homey/core/core-v0.11f.live-homey.js'
      - 'src/homey/core/core-planner-v05-compat.js'
      - 'scripts/build-core-v0.11g-planner-v05-candidate.js'
      - 'tests/core-planner-v05-compat.test.js'
      - 'tests/core-v0.11g-integration.test.js'
      - '.github/workflows/core-planner-v05-compat.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compatibility unit tests
        run: node tests/core-planner-v05-compat.test.js
      - name: Core integration/load invariant tests
        run: node tests/core-v0.11g-integration.test.js
      - name: Build integrated Core candidate
        run: node scripts/build-core-v0.11g-planner-v05-candidate.js
      - name: Syntax check integrated HomeyScript candidate
        run: |
          node -e "const fs=require('fs'); const s=fs.readFileSync('build/core-v0.11g-planner-v05.candidate.js','utf8'); new Function('return (async()=>{\\n'+s+'\\n});'); console.log('PASS HomeyScript syntax');"
      - name: Guard pure compatibility helper
        run: |
          ! grep -Eq 'Homey\.|getVariables\(|getVariable\(|updateVariable\(|createVariable\(|fetch\(' src/homey/core/core-planner-v05-compat.js
      - name: Guard no new Homey load or physical writes
        run: |
          test "$(grep -o 'Homey.logic.getVariables()' src/homey/core/core-v0.11f.live-homey.js | wc -l)" = "$(grep -o 'Homey.logic.getVariables()' build/core-v0.11g-planner-v05.candidate.js | wc -l)"
          test "$(grep -o 'Homey.devices.getDevice(' src/homey/core/core-v0.11f.live-homey.js | wc -l)" = "$(grep -o 'Homey.devices.getDevice(' build/core-v0.11g-planner-v05.candidate.js | wc -l)"
          test "$(grep -o 'setCapabilityValue' src/homey/core/core-v0.11f.live-homey.js | wc -l)" = "$(grep -o 'setCapabilityValue' build/core-v0.11g-planner-v05.candidate.js | wc -l)"
