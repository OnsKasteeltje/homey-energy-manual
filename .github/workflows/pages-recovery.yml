name: Recover MkDocs Pages deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-recovery
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip check
      - name: Run tests and repository validation
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          node --test tests/*.test.mjs
          python scripts/validate_repository.py
      - name: Build frontend bundles
        run: python scripts/build_frontend_bundles.py
      - name: Validate generated frontend artifact
        run: python scripts/validate_frontend_artifact.py
      - name: Check generated JavaScript bundle
        run: |
          VERSION="$(tr -d '\r\n' < frontend-version.txt)"
          node --check "docs/javascripts/frontend-bundle-${VERSION}.js"
      - name: Build MkDocs
        run: mkdocs build --strict
      - name: Verify built site references active frontend
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < frontend-version.txt)"
          grep -R -q "frontend-bundle-${VERSION}.js" site
          grep -R -q "frontend-bundle-${VERSION}.css" site
          grep -R -q "Quooker" site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
