name: Retired EMS Pages - public landing only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Build minimal public landing, without repository data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="nl">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="robots" content="noindex, nofollow">
            <title>Home Energy Management</title>
          </head>
          <body>
            <main>
              <h1>Home Energy Management</h1>
              <p>De eerdere openbare website is buiten gebruik.</p>
              <p>Live energiedata, historie en bediening worden niet via GitHub Pages aangeboden.</p>
            </main>
          </body>
          </html>
          HTML
          test -s site/index.html
          test "$(find site -type f | wc -l)" -eq 1
          test ! -d site/data

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload sanitized artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site

      - name: Publish sanitized site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
