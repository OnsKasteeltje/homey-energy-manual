name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/data/homey-status.json"
      - "docs/data/shadow-status.json"
      - "docs/data/energy-state-v2.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.23.2"

      - name: Install locked Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip check

      - name: Run Python tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run JavaScript tests
        run: node --test tests/*.test.mjs

      - name: Validate repository contracts
        run: python scripts/validate_repository.py

      - name: Lint Python for correctness
        run: ruff check scripts tests --select E9,F63,F7,F82

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find docs/javascripts -type f -name '*.js' ! -name 'frontend-bundle-*.js' -print0)

      - name: Build frontend bundles
        run: python scripts/build_frontend_bundles.py

      - name: Validate generated frontend artifact
        run: python scripts/validate_frontend_artifact.py

      - name: Check generated JavaScript bundle
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < frontend-version.txt)"
          node --check "docs/javascripts/frontend-bundle-${VERSION}.js"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Build MkDocs strictly
        run: mkdocs build --strict

      - name: Verify built site references active frontend
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < frontend-version.txt)"
          grep -R -q "frontend-bundle-${VERSION}.js" site
          grep -R -q "frontend-bundle-${VERSION}.css" site
          grep -R -q "Quooker" site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
