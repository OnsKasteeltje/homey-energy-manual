name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'frontend-version.txt'
      - 'mkdocs.yml'
      - 'scripts/build_frontend_bundles.py'
      - 'scripts/sync_energy_contract.py'
      - 'scripts/recover_energy_history.py'
      - 'docs/javascripts/**'
      - 'docs/stylesheets/**'
      - 'docs/service-worker.js'
      - 'docs/planner-shadow.md'
      - 'docs/data/energy-planner-shadow.json'
      - 'docs/data/energy-state-v2.json'
      - 'docs/data/energy-state-v2.schema.json'
      - 'docs/data/energy-day-v2.json'
      - 'docs/data/energy-day-series-7d.json'
      - 'docs/data/energy-daily-history.json'
      - 'docs/data/tesla-deadline-command.json'
      - 'docs/data/ems-settings-command.json'
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Pages is a rolling view. A stale queued build has no value once a newer
# commit exists, so always cancel the previous run and deploy only the latest.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # History is a deliberate resilience source: completed day-series
          # snapshots can be recovered even when Homey's midnight archive flow
          # missed a run.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.23.2"

      - name: Install locked Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip check

      - name: Synchronize Energy State contract version
        run: python scripts/sync_energy_contract.py

      - name: Persist synchronized Energy State contract
        shell: bash
        run: |
          set -euo pipefail
          SCHEMA="docs/data/energy-state-v2.schema.json"
          if git diff --quiet -- "$SCHEMA"; then
            echo "Canonical Energy State contract already matches runtime."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SCHEMA"
          git commit -m "chore: sync Energy State publisher contract"
          git push origin HEAD:main

      - name: Recover missed completed-day archives
        run: python scripts/recover_energy_history.py

      - name: Run Python tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run JavaScript tests
        run: node --test tests/*.test.mjs

      - name: Validate repository contracts
        run: python scripts/validate_repository.py

      - name: Lint Python for correctness
        run: ruff check scripts tests --select E9,F63,F7,F82

      - name: Check JavaScript source syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find docs/javascripts -type f -name '*.js' ! -name 'frontend-bundle-*.js' -print0)

      - name: Build frontend bundles
        run: python scripts/build_frontend_bundles.py

      - name: Validate generated frontend artifact
        run: python scripts/validate_frontend_artifact.py

      - name: Check generated frontend bundle syntax
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < frontend-version.txt)"
          JS="docs/javascripts/frontend-bundle-${VERSION}.js"
          CSS="docs/stylesheets/frontend-bundle-${VERSION}.css"
          test -s "$JS"
          test -s "$CSS"
          node --check "$JS"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Build MkDocs strictly
        run: mkdocs build --strict

      - name: Verify built site references active frontend
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < frontend-version.txt)"
          grep -R -q "frontend-bundle-${VERSION}.js" site
          grep -R -q "frontend-bundle-${VERSION}.css" site
          test -s site/service-worker.js
          test -s site/data/energy-planner-shadow.json
          test -s site/data/energy-day-series-7d.json
          test -s site/data/energy-daily-history.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
