name: EMS Security Scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'requirements*.txt'
      - 'requirements.lock'
      - 'src/**'
      - 'scripts/**'
      - 'deploy/**'
      - '.github/workflows/**'
      - '.gitignore'
  pull_request:
    paths:
      - 'requirements*.txt'
      - 'requirements.lock'
      - 'src/**'
      - 'scripts/**'
      - 'deploy/**'
      - '.github/workflows/**'
      - '.gitignore'

permissions:
  contents: read

jobs:
  python-dependencies:
    name: Python dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check pip-audit
      - name: Audit locked Python dependencies
        run: pip-audit -r requirements.lock

  python-static-analysis:
    name: Python static security analysis
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Bandit
        run: python -m pip install --disable-pip-version-check bandit
      - name: Scan Python source
        run: |
          targets=()
          [[ -d src ]] && targets+=(src)
          [[ -d scripts ]] && targets+=(scripts)
          if [[ ${#targets[@]} -eq 0 ]]; then
            echo 'No Python source directories found.'
            exit 0
          fi
          bandit -r "${targets[@]}" -f screen

  shell-analysis:
    name: Shell static analysis
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: |
          mapfile -t files < <(find scripts deploy -type f -name '*.sh' -print 2>/dev/null)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo 'No shell scripts found.'
            exit 0
          fi
          shellcheck "${files[@]}"

  secret-baseline:
    name: Secret-pattern baseline
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history with Gitleaks
        env:
          GITLEAKS_VERSION: '8.28.0'
        run: |
          curl -fsSLo /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          set +e
          /tmp/gitleaks git . --redact --no-banner --report-format json --report-path /tmp/gitleaks.json
          rc=$?
          set -e
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('/tmp/gitleaks.json')
          findings = json.loads(p.read_text()) if p.exists() else []
          print(f'Gitleaks candidate findings: {len(findings)}')
          for f in findings:
              print(
                  f"rule={f.get('RuleID','?')} "
                  f"file={f.get('File','?')} "
                  f"line={f.get('StartLine','?')} "
                  f"commit={str(f.get('Commit','?'))[:12]}"
              )
          PY
          exit "$rc"

  workflow-hygiene:
    name: GitHub Actions hygiene baseline
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Flag broad write permissions and unpinned action refs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          findings = []
          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              text = path.read_text(encoding='utf-8')
              if re.search(r'(?m)^\s*permissions:\s*write-all\s*$', text):
                  findings.append(f'{path}: uses permissions: write-all')
              for lineno, line in enumerate(text.splitlines(), 1):
                  m = re.search(r'\buses:\s*([^\s#]+)', line)
                  if not m:
                      continue
                  ref = m.group(1)
                  if ref.startswith('./') or '@' not in ref:
                      continue
                  version = ref.rsplit('@', 1)[1]
                  if not re.fullmatch(r'[0-9a-fA-F]{40}', version):
                      findings.append(f'{path}:{lineno}: action not pinned to full commit SHA: {ref}')
          if findings:
              print('\n'.join(findings))
              raise SystemExit(1)
          print('No baseline workflow-hygiene findings.')
          PY
