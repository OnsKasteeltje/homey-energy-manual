name: Planner Frontend Browser Smoke

on:
  push:
    branches:
      - planner-frontend-rebuild
    paths:
      - 'docs/planner-shadow.md'
      - 'docs/javascripts/**'
      - 'docs/stylesheets/**'
      - 'docs/data/energy-planner-shadow.json'
      - 'mkdocs.yml'
      - 'frontend-version.txt'
      - 'scripts/build_frontend_bundles.py'
      - 'tests/planner_browser_smoke.py'
      - '.github/workflows/planner-frontend-smoke.yml'
  pull_request:
    paths:
      - 'docs/planner-shadow.md'
      - 'docs/javascripts/**'
      - 'docs/stylesheets/**'
      - 'docs/data/energy-planner-shadow.json'
      - 'mkdocs.yml'
      - 'frontend-version.txt'
      - 'scripts/build_frontend_bundles.py'
      - 'tests/planner_browser_smoke.py'
      - '.github/workflows/planner-frontend-smoke.yml'

permissions:
  contents: read

jobs:
  planner-browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Build frontend bundle
        run: python scripts/build_frontend_bundles.py

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Run Planner browser smoke
        run: python tests/planner_browser_smoke.py

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: planner-smoke-failure
          path: planner-smoke-failure.png
          if-no-files-found: ignore
