site_name: Homey Energy Manual
site_description: Technische documentatie van de Homey energie-automatisering
theme:
  name: material
  language: nl
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
nav:
  - Home: index.md
  - Live energiestroom: live-energie.md
  - Planner: planner.md
  - Energiehistorie: energiehistorie.md
  - Groepen & fasen: groepen-fasen.md
markdown_extensions:
  - admonition
  - tables
  - fenced_code
  - toc:
      permalink: true

# Assetversies worden tijdens de build gesynchroniseerd vanuit frontend-version.txt.
# De Planner-pagina bevat de basisweergave inline; deze kleine progressive-enhancement
# voegt de interactieve forecastweergave toe zonder plannerdata of control logic te wijzigen.
extra_javascript:
  - javascripts/frontend-bundle-__FRONTEND_VERSION__.js
  - javascripts/planner-forecast-interactive-v1.0.0.js

extra_css:
  - stylesheets/frontend-bundle-__FRONTEND_VERSION__.css
