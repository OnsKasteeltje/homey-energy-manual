site_name: Homey Energy Manual
site_description: Technische documentatie van de Homey energie-automatisering
theme:
  name: material
  language: nl
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - content.code.copy
nav:
  - Home: index.md
  - Live energiestroom: live-energie.md
  - Planner: planner.md
  - Energiehistorie: energiehistorie.md
  - Groepen & fasen: groepen-fasen.md
markdown_extensions:
  - admonition
  - tables
  - fenced_code
  - toc:
      permalink: true

# Assetversies worden tijdens de build gesynchroniseerd vanuit frontend-version.txt.
# De timezone guard staat bewust vóór de frontend bundle zodat UTC-timestamps
# nooit eerst als lokale datetime zichtbaar worden.
extra_javascript:
  - javascripts/timezone-europe-amsterdam-v1.0.1.js
  - javascripts/frontend-bundle-__FRONTEND_VERSION__.js
  - javascripts/planner-forecast-interactive-v1.0.0.js
  - javascripts/tesla-deadline-pending-intent-v1.0.0.js
  - javascripts/heating-schedule-chart-v1.0.0.js

extra_css:
  - stylesheets/frontend-bundle-__FRONTEND_VERSION__.css
  - stylesheets/heating-schedule-chart-v1.0.0.css
