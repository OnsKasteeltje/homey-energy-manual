site_name: Homey Energy Manual
site_description: Technische documentatie van de Homey energie-automatisering
theme:
  name: material
  language: nl
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
nav:
  - Home: index.md
  - Live energiestroom: live-energie.md
  - Planner Shadow: planner-shadow.md
  - Energiehistorie: energiehistorie.md
  - Groepen & fasen: groepen-fasen.md
markdown_extensions:
  - admonition
  - tables
  - fenced_code
  - toc:
      permalink: true

# Assetversies worden tijdens de build gesynchroniseerd vanuit frontend-version.txt.
# Planner Shadow lifecycle staat apart zodat instant navigation de renderer opnieuw kan initialiseren.
# v1.0.9 voegt de read-only Plan -> Power Intent -> Adapter evidence-laag toe.
extra_javascript:
  - javascripts/frontend-bundle-__FRONTEND_VERSION__.js
  - javascripts/planner-page-lifecycle-v1.0.9.js

extra_css:
  - stylesheets/frontend-bundle-__FRONTEND_VERSION__.css
