site_name: Homey Energy Manual
site_description: Technische documentatie van de Homey energie-automatisering
theme:
  name: material
  language: nl
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
nav:
  - Home: index.md
  - Live energiestroom: live-energie.md
  - Energiehistorie: energiehistorie.md
  - Flows:
      - Warm water: warm-water.md
      - Energie Manager PV: energie-manager.md
      - M7 – Prijs & PV Forecast: m7-prijs-pv-forecast.md
      - M7 – Opportunity Score Shadow: m7-opportunity-shadow.md
      - Quooker-regeling: quooker.md
      - GitHub status- & shadow-sync: github-sync-flows.md
  - Groepen & fasen: groepen-fasen.md
  - Schaduw: shadow.md
  - Systeem:
      - Lokale status-sync: status-sync.md
      - Tesla deadline write-route: tesla-deadline-write-route.md
      - Architectuur: architectuur.md
      - Variabelen & tags: variabelen.md
  - Wijzigingshistorie: wijzigingshistorie.md
markdown_extensions:
  - admonition
  - tables
  - fenced_code
  - toc:
      permalink: true

extra_javascript:
  - javascripts/homey-status-v2.js
  - javascripts/pv-phase-24h.js
  - javascripts/live-energy-v2.8.9.js
  - javascripts/tesla-deadline-ui-v2.8.16.js
  - javascripts/tesla-deadline-migration-v2.8.17.js
  - javascripts/live-energy-tuning-v2.8.6.js
  - javascripts/energy-history-v2.8.8.js
  - javascripts/energy-history-events-v2.8.15.js
  - javascripts/home-architecture-v1.6.js

extra_css:
  - stylesheets/extra.css
  - stylesheets/tesla-deadline-v2.8.10.css
  - stylesheets/tesla-deadline-v2.8.17.css
  - stylesheets/energy-history-v2.8.14.css
  - stylesheets/home-architecture-v1.css
