site_name: Homey Energy Manual
site_description: Technische documentatie van de Homey energie-automatisering
theme:
  name: material
  language: nl
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
nav:
  - Home: index.md
  - Flows:
      - Warm water: warm-water.md
      - Energie Manager PV: energie-manager.md
  - Systeem:
      - Architectuur: architectuur.md
      - Variabelen & tags: variabelen.md
  - Wijzigingshistorie: wijzigingshistorie.md
markdown_extensions:
  - admonition
  - tables
  - fenced_code
  - toc:
      permalink: true
