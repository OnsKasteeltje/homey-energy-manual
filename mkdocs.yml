site_name: Homey Energy Manual
site_description: Technische documentatie van de Homey energie-automatisering
theme:
  name: material
  language: nl
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
nav:
  - Home: index.md
  - Live energiestroom: live-energie.md
  - Energiehistorie: energiehistorie.md
  - Flows:
      - Warm water: warm-water.md
      - Energie Manager PV: energie-manager.md
      - Energy Manager migratie: energy-manager-migration.md
      - Energy Core v2: energy-core-v2.md
      - M7 – Prijs & PV Forecast: m7-prijs-pv-forecast.md
      - M7 – Opportunity Score Shadow: m7-opportunity-shadow.md
      - Quooker-regeling: quooker.md
      - GitHub status- & shadow-sync: github-sync-flows.md
  - Groepen & fasen: groepen-fasen.md
  - Schaduw: shadow.md
  - Systeem:
      - Lokale status-sync: status-sync.md
      - Tesla deadline write-route: tesla-deadline-write-route.md
      - Architectuur: architectuur.md
      - Variabelen & tags: variabelen.md
  - Wijzigingshistorie: wijzigingshistorie.md
markdown_extensions:
  - admonition
  - tables
  - fenced_code
  - toc:
      permalink: true

extra_javascript:
  - javascripts/energy-core-v2-adapter-v2.8.33.js
  - javascripts/em-v2-health-v2.0.4.js
  - javascripts/homey-status-v2.js
  - javascripts/pv-phase-24h.js
  - javascripts/live-energy-v2.8.39.js
  - javascripts/tesla-deadline-ui-v2.8.16.js
  - javascripts/tesla-deadline-migration-v2.8.17.js
  - javascripts/tesla-deadline-postsave-v2.8.18.js
  - javascripts/tesla-deadline-status-v2.8.21.js
  - javascripts/tesla-runtime-ui-v2.8.24.js
  - javascripts/live-energy-tuning-v2.8.6.js
  - javascripts/energy-history-v2.8.31.js
  - javascripts/energy-history-tesla-quality-v2.8.37.js
  - javascripts/energy-history-autorefresh-v2.8.34.js
  - javascripts/home-architecture-v2.0.3.js

extra_css:
  - stylesheets/extra.css
  - stylesheets/live-energy-v2.0.9.css
  - stylesheets/em-v2-health-v2.8.29.css
