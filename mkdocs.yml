site_name: Homey Energy Manual
site_description: Technische documentatie van de Homey energie-automatisering
theme:
  name: material
  language: nl
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
nav:
  - Home: index.md
  - Live energiestroom: live-energie.md
  - Planner: planner.md
  - Energiehistorie: energiehistorie.md
  - Groepen & fasen: groepen-fasen.md
markdown_extensions:
  - admonition
  - tables
  - fenced_code
  - toc:
      permalink: true

# Assetversies worden tijdens de build gesynchroniseerd vanuit frontend-version.txt.
# De Planner-pagina is bewust self-contained en heeft geen aparte lifecycle/decorator-scripts nodig.
extra_javascript:
  - javascripts/frontend-bundle-__FRONTEND_VERSION__.js

extra_css:
  - stylesheets/frontend-bundle-__FRONTEND_VERSION__.css
